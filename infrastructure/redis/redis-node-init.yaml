apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: redis-init-node
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: redis-init-node
  template:
    metadata:
      labels:
        app: redis-init-node
    spec:
      initContainers:
        - name: configure-node
          image: busybox:1.36
          command:
            - sh
            - -ec
            - |
              sysctl -w vm.overcommit_memory=1

              if [ -f /sys/kernel/mm/transparent_hugepage/enabled ]; then
                echo never > /sys/kernel/mm/transparent_hugepage/enabled
              fi

              if [ -f /sys/kernel/mm/transparent_hugepage/defrag ]; then
                echo never > /sys/kernel/mm/transparent_hugepage/defrag
              fi
          securityContext:
            privileged: true

      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 1m
              memory: 1Mi
            limits:
              memory: 4Mi