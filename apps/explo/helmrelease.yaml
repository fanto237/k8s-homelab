apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: explo
  namespace: explo
spec:
  suspend: false
  interval: 30m
  timeout: 15m
  releaseName: explo
  targetNamespace: explo
  chart:
    spec:
      chart: explo
      version: 1.2.0
      sourceRef:
        kind: HelmRepository
        name: explo
        namespace: explo
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      tag: v1.2.0
    env:
      TZ: Europe/Berlin
    auth:
      existingSecret: explo-ui-auth
    persistence:
      config:
        size: 2Gi
      media:
        existingClaim: explo-music
        mountPath: /data
        subPath: Explo
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
