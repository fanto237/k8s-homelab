apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: patchmon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        - name: fix-permissions
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              mkdir -p /data/agents /data/assets
              chown -R 1000:1000 /data
              chmod -R 775 /data
          volumeMounts:
            - name: patchmon-files
              mountPath: /data
      containers:
        - name: backend
          image: ghcr.io/patchmon/patchmon-backend:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: patchmon-config
            - secretRef:
                name: patchmon-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: patchmon-files
              mountPath: /app/agents
              subPath: agents
            - name: patchmon-files
              mountPath: /app/assets
              subPath: assets

      volumes:
        - name: patchmon-files
          persistentVolumeClaim:
            claimName: patchmon-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: patchmon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/patchmon/patchmon-frontend:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: patchmon-config-frontend
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: patchmon-files
              mountPath: /usr/share/nginx/html/assets

      volumes:
        - name: patchmon-files
          persistentVolumeClaim:
            claimName: patchmon-frontend
---
