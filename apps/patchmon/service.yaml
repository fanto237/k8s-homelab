apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: patchmon
spec:
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3001

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: patchmon
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
