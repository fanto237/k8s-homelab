apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: patchmon-backend
  namespace: patchmon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: patchmon-frontend
  namespace: patchmon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
