apiVersion: apps/v1
kind: Deployment
metadata:
  name: netalertx
  namespace: netalertx
  labels:
    app: netalertx
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: netalertx
  template:
    metadata:
      labels:
        app: netalertx
    spec:
      hostNetwork: false
      initContainers:
        - name: initialize-data-directory
          image: busybox:1.37
          command:
            - sh
            - -ec
            - mkdir -p /data
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: netalertx
          image: ghcr.io/netalertx/netalertx:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: netalertx
            - secretRef:
                name: netalertx
          ports:
            - name: http
              containerPort: 20211
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_RAW
                - NET_BIND_SERVICE
                - CHOWN
                - SETUID
                - SETGID
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: netalertx
        - name: tmp
          emptyDir:
            medium: Memory
